name: Refresh profile (views + dashboard)

on:
  schedule:
    - cron: "0 */3 * * *"      # every 3 hours
  workflow_dispatch:            # lets you press "Run workflow" manually

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update profile views card
        run: python3 update_views.py

      - name: Update dashboard (repos, stars, forks, followers)
        if: always()            # runs even if the views step failed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 update_dashboard.py

      - name: Commit and push
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add views.svg views-data.json id-dashboard-fixed.svg dashboard-data.json README.md
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "refresh profile data"
            git pull --rebase origin main || true
            git push
          fi
