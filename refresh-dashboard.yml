
name: Refresh Live Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Generate updated SVG
        env:
          TZ: Asia/Kolkata
        run: |
          python build.py --live

      - name: Commit updated SVG and data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add views.svg

          if [ -f views-data.json ]; then
            git add views-data.json
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Update profile views and IST timestamp"
            git push
          fi
