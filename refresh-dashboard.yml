name: Refresh profile views

on:
  schedule:
    - cron: "0 */3 * * *"      # every 3 hours
  workflow_dispatch:            # lets you press "Run workflow" manually

permissions:
  contents: write

concurrency:
  group: refresh-views
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update views.svg
        run: python3 update_views.py
      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add views.svg views-data.json README.md
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "refresh profile views"
            git pull --rebase origin main || true
            git push
          fi
